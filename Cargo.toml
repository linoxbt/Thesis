[workspace]
members = ["programs/*"]
exclude = ["tests/harness"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
# Size over speed: program rent scales with binary size (2x during deploy).
opt-level = "z"
strip = true

[profile.release.build-override]
opt-level = "z"
incremental = false
codegen-units = 1
